<!doctype html>
<html lang="en-GB">
    <head>
        <title>Interval timer for circuit workouts</title>
        <meta charset="utf-8">
        <meta http-equiv="content-security-policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
        <meta name="description" content="Interval timer for circuit workouts. Build your own workouts with rounds, work and rest, then follow them on a full-screen timer.">
        <meta name="viewport" content="width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="dark">
        <meta name="theme-color" content="#080a0e">
        <meta name="apple-mobile-web-app-title" content="Intervals">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link href="https://jarovarga.github.io/intervals/" rel="canonical">
        <link href="./assets/img/icon.svg" rel="icon" type="image/svg+xml">
        <link href="./assets/img/icon-96x96.png" rel="icon" type="image/png" sizes="96x96">
        <link href="./assets/img/icon-180x180.png" rel="apple-touch-icon" sizes="180x180">
        <link href="./assets/fonts/inter-latin.woff2" rel="preload" as="font" type="font/woff2" crossorigin>
        <link href="./assets/fonts/anton-latin.woff2" rel="preload" as="font" type="font/woff2" crossorigin>
        <link href="./assets/css/app.min.css" rel="stylesheet">
        <link href="./app.webmanifest" rel="manifest">
    </head>
    <body id="app">
        <header data-navigation class="navigation">
            <div class="container">
                <h1 class="navigation__brand"><img src="./assets/img/logo.svg" width="40" height="40" alt="" class="navigation__logo">Intervals</h1>
                <nav class="navigation__bar" aria-label="Sections">
                    <ul class="navigation__menu">
                        <li><a href="#workouts" data-icon="timer" class="navigation__link"><span class="navigation__text">Workouts</span></a></li>
                        <li><a href="#health" data-icon="heart" class="navigation__link"><span class="navigation__text">Health</span></a></li>
                        <li><a href="#log" data-icon="chart-no-axes-column" class="navigation__link"><span class="navigation__text">Log</span></a></li>
                        <li><a href="#settings" data-icon="settings" class="navigation__link"><span class="navigation__text">Settings</span></a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <div role="status">
                <div class="container">
                    <div data-notice="update" class="panel" hidden>
                        <div class="panel__block">
                            <p class="panel__title">A new version is ready.</p>
                            <button type="button" data-action="reload" class="button button--accent button--compact">Reload</button>
                        </div>
                    </div>
                </div>
            </div>

            <aside data-notice="install" class="container" aria-labelledby="install-title" hidden>
                <div class="panel">
                    <p id="install-title" class="panel__title">Install</p>
                    <p class="panel__note">Tap Share, then Add to Home Screen to open the app full screen like an app.</p>
                    <button type="button" data-action="dismiss-install" class="button button--compact">Not now</button>
                </div>
            </aside>

            <section data-screen id="workouts" class="section" aria-labelledby="workouts-title">
                <div class="container">
                    <h2 tabindex="-1" id="workouts-title" class="visually-hidden">Workouts</h2>
                </div>
            </section>

            <section data-screen id="health" class="section" aria-labelledby="health-title" hidden>
                <div class="container">
                    <h2 tabindex="-1" id="health-title" class="visually-hidden">Health</h2>
                </div>
            </section>

            <section data-screen id="log" class="section" aria-labelledby="log-title" hidden>
                <div class="container">
                    <h2 tabindex="-1" id="log-title" class="visually-hidden">Log</h2>
                </div>
            </section>

            <section data-screen data-section="settings" id="settings" class="section settings" aria-labelledby="settings-title" hidden>
                <div class="container">
                    <h2 tabindex="-1" id="settings-title" class="visually-hidden">Settings</h2>

                    <div class="settings__actions">
                        <button type="button" data-action="check-update" class="button">Check for updates</button>
                        <button type="button" data-action="install" class="button" hidden>Show install guide</button>
                    </div>

                    <p data-status="settings" class="settings__status" role="status"></p>

                    <a href="https://ko-fi.com/jarovarga/tip" rel="noopener" class="settings__support">Buy me a coffee</a>

                    <p class="settings__version">Version __APP_VERSION__</p>
                </div>
            </section>

            <section data-screen="full" id="editor" class="section" aria-labelledby="editor-title" hidden>
                <div class="container">
                    <h2 tabindex="-1" id="editor-title" class="section__title">Edit workout</h2>
                    <a href="#workouts" class="button">Cancel</a>
                </div>
            </section>

            <section data-screen="full" id="timer" class="section" aria-labelledby="timer-title" hidden>
                <div class="container">
                    <h2 tabindex="-1" id="timer-title" class="section__title">Workout</h2>
                    <a href="#workouts" class="button">End</a>
                </div>
            </section>
        </main>

        <script src="./assets/js/app.min.js" type="module"></script>
    </body>
</html>
